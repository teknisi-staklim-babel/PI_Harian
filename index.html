vember 2026 07:00 WIB"}, {"pos_hujan_id": "19040501a", "station_name": "Cambai", "latitude": -2.24083, "longitude": 106.15389, "data_timestamp": "11/18/2026", "rr": 9.0, "created_at": "11/11/2026 1:04", "updated_at": "11/18/2026 0:24", "qc_flag": 0.0, "qc_histories": null, "modified_by": "oprmobile19040501a", "observer_name": "Aflah Yuliarti", "LOKASI": "Cambai", "CH": 9.0, "nama_norm": "cambai", "kabupaten": "Bangka Tengah", "periode": "Pengukuran 17 November 2026 07:00 WIB s.d 18 November 2026 07:00 WIB"}, {"pos_hujan_id": "19040601a", "station_name": "Lubuk Besar", "latitude": -2.54361, "longitude": 106.66833, "data_timestamp": "11/18/2026", "rr": 0.0, "created_at": "11/18/2026 1:00", "updated_at": "11/18/2026 1:00", "qc_flag": 0.0, "qc_histories": null, "modified_by": "oprmobile19040601a", "observer_name": "Aflah Yuliarti", "LOKASI": "Lubuk Besar", "CH": 0.0, "nama_norm": "lubuk besar", "kabupaten": "Bangka Tengah", "periode": "Pengukuran 17 November 2026 07:00 WIB s.d 18 November 2026 07:00 WIB"}];

// kategori + warna
function getKategori(val) {
    if (val < 0.5) return ["Tidak ada hujan", "#cccccc"];
    if (val <= 20) return ["Ringan", "#00ff00"];
    if (val <= 50) return ["Sedang", "#ffff00"];
    if (val <= 100) return ["Lebat", "#ffa500"];
    if (val <= 150) return ["Sangat Lebat", "#ff0000"];
    return ["Ekstrem", "#ff00ff"];
}

// urutan kabupaten
const urutanKab = [
    "Bangka Barat",
    "Bangka",
    "Bangka Tengah",
    "Bangka Selatan",
    "Belitung",
    "Belitung Timur"
];

// ambil kabupaten unik lalu urutkan
const kabList = urutanKab.filter(kab =>
    dataGlobal.some(d => d.kabupaten === kab)
);

const select = document.getElementById("filterKab");

// default option
let defaultOpt = document.createElement("option");
defaultOpt.value = "";
defaultOpt.innerText = "Pilih Kabupaten";
defaultOpt.selected = true;
defaultOpt.disabled = true;
select.appendChild(defaultOpt);

// isi dropdown
kabList.forEach(kab => {
    let opt = document.createElement("option");
    opt.value = kab;
    opt.innerText = kab;
    select.appendChild(opt);
});

// inisialisasi chart kosong
let chart = new Chart(document.getElementById("chartCH"), {
    type: "bar",
    data: {
        labels: [],
        datasets: [{
            label: "Curah Hujan (mm)",
            data: []
        }]
    },
    options: {
        responsive: true
    }
});

function renderChart(kabupaten) {

    document.getElementById("infoText").style.display = "none";

    let filtered = dataGlobal.filter(
        d => d.kabupaten === kabupaten
    );

    filtered.sort((a, b) => b.CH - a.CH);

    const labels = filtered.map(d => d.LOKASI);
    const values = filtered.map(d => d.CH);
    const colors = values.map(v => getKategori(v)[1]);

    chart.destroy();

    chart = new Chart(document.getElementById("chartCH"), {
        type: "bar",
        data: {
            labels: labels,
            datasets: [{
                label: "Curah Hujan (mm)",
                data: values,
                backgroundColor: colors
            }]
        },
        options: {
            responsive: true,
            plugins: {
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            let val = context.raw;
                            let kategori = getKategori(val)[0];

                            return context.label + ": " +
                                val + " mm (" + kategori + ")";
                        }
                    }
                },
                legend: {
                    display: false
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    title: {
                        display: true,
                        text: "Curah Hujan (mm)"
                    }
                }
            }
        }
    });
}

// event dropdown
select.addEventListener("change", function() {
    if (this.value !== "") {
        renderChart(this.value);
    }
});
</script>

</html>
